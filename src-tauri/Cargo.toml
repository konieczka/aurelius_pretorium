[package]
name = "fleet_command"
version = "0.2.6"
description = "Pretorium: command a fleet of coding agents"
authors = ["Michał Konieczka"]
edition = "2021"
default-run = "fleet_command"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fleet_command_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The E2E tests' backend: the app's commands over HTTP, for its frontend running in a test browser (see e2e/).
[features]
e2e = []

[[bin]]
name = "e2e_harness"
required-features = ["e2e"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable"] } # unstable: child webviews (browser tabs, web.rs)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
tauri-plugin-dialog = "2"
trash = "5"
ureq = "3"
toml_edit = "0.25.17"
jsonc-parser = { version = "0.34.0", features = ["serde", "cst"] }
libc = "0.2"
base64 = "0.22"
vt100 = "0.16"
tokio-postgres = "0.7"
csv = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["time", "sync", "macros", "process"] }
redis = { version = "1.7.1", default-features = false, features = ["tokio-comp"] }
mysql_async = { version = "0.37.1", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled", "column_decltype"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSString", "NSURL", "NSValue"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSBitmapImageRep", "NSImageRep", "NSPasteboard"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKContentWorld", "WKFrameInfo", "WKScriptMessage", "WKScriptMessageHandlerWithReply", "WKSecurityOrigin", "WKUserContentController", "WKUserScript", "WKWebView", "WKWebViewConfiguration"] }
block2 = "0.6"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
